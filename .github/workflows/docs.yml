name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'TikTokLive/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'scripts/seo/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'TikTokLive/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'scripts/seo/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Deployment runs only where the Cloudflare secrets exist; forks and pull requests skip it.
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install library and documentation tools
        run: pip install -e ".[test]" -r docs/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@10.34.2
      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Test the documentation scripts
        run: python -m pytest docs/scripts/tests
      - name: Validate and build documentation
        run: pnpm --dir docs build
      - name: Verify SEO invariants
        run: python scripts/seo/verify_seo.py docs/dist
      - name: Generate redirects for the old GitHub Pages site
        run: python docs/scripts/gen_redirects.py docs/redirects
      - name: Upload site for review
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/dist
      - name: Upload redirects for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/redirects
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          packageManager: pnpm
          command: deploy

  pages:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
